name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify packed CLI install
        run: |
          mkdir -p "$RUNNER_TEMP/cli-pack"
          pnpm --filter @4evergent/cli pack --pack-destination "$RUNNER_TEMP/cli-pack"
          npm install --prefix "$RUNNER_TEMP/cli-install" "$RUNNER_TEMP"/cli-pack/*.tgz
          expected="$(node -p "require('./apps/cli/package.json').version")"
          actual="$("$RUNNER_TEMP/cli-install/node_modules/.bin/4evergent" --version)"
          test "$actual" = "$expected"

      - name: Validate OpenAPI document
        run: pnpm check:openapi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
